# Prometheus + Grafana for Founder Mode metrics.
# Bot must expose /metrics (default port 9090, see METRICS_PORT in .env).
#
# Start: cd deploy/observability && docker compose up -d
# - Prometheus UI: http://localhost:9091  (9091 avoids clashing with bot METRICS_PORT 9090)
# - Grafana:       http://localhost:3000 (admin / see GF_SECURITY_ADMIN_PASSWORD)
#
# If the bot runs on the host (systemd): ensure metrics listen on 0.0.0.0:9090 (default in code).
# If the bot runs in another container: set SCRAPE_TARGET in .env to e.g. bot_container_name:9090
# and use the same Docker network (see README).

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: founder-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.3.0
    container_name: founder-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability

volumes:
  prometheus-data:
  grafana-data:

networks:
  observability:
    driver: bridge
