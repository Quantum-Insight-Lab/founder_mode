# Хостовый watchdog (softdog + systemd).
# Требуется модуль ядра softdog — см. deploy/modules-load.d/softdog.conf и install-host-watchdog.sh
#
# После копирования в /etc/systemd/system.conf.d/:
#   sudo modprobe softdog
#   sudo systemctl daemon-reexec
# (кратковременный разрыв SSH возможен; при сомнениях — перезагрузка)
#
[Manager]
# Если systemd (PID 1) не обновляет watchdog вовремя — срабатывает перезагрузка (зависание ядра/полный стоп init).
RuntimeWatchdogSec=2min
# Если shutdown завис — принудительный сброс после таймаута.
RebootWatchdogSec=10min
